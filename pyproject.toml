[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-bugbot"
version = "0.1.0"
description = "Free local Cursor-style Bugbot for Codex and Claude Code."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LegalVoice" }
]
keywords = ["code-review", "pull-requests", "repository-graph", "static-analysis", "ai-agents", "codex", "claude-code", "bugbot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
repo-bugbot-index = "repo_bugbot.index_repo_graph:main"
repo-bugbot-impact = "repo_bugbot.diff_impact:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_bugbot*"]
